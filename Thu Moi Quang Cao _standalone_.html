  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n    --ink:          #0f1a13;\n    --ink-2:        #46544a;\n    --ink-3:        #7c8a80;\n    --paper:        #ffffff;\n    --paper-2:      #f7faf7;\n    --rule:         #dfe6e0;\n    --accent:       #f59e0b;   /* amber from the \"M\u1edf \u0111\u0103ng k\u00fd\" pill */\n    --shadow-page:  0 1px 2px rgba(15,26,19,.04), 0 24px 60px -20px rgba(15,26,19,.18);\n  }\n\n  *{box-sizing:border-box}\n  html,body{margin:0;padding:0}\n  body{\n    font-family:'Be Vietnam Pro', system-ui, sans-serif;\n    background:\n      radial-gradient(1200px 600px at 80% -10%, #e9f3eb 0%, transparent 60%),\n      radial-gradient(900px 500px at 0% 110%, #eef4ec 0%, transparent 60%),\n      #f1f5f1;\n    color:var(--ink);\n    -webkit-font-smoothing:antialiased;\n    padding: 32px 16px 80px;\n  }\n\n  /* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 page (A4) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n  .page{\n    width: 210mm;\n    min-height: 297mm;\n    margin: 0 auto;\n    background: var(--paper);\n    box-shadow: var(--shadow-page);\n    position: relative;\n    overflow: hidden;\n    border-radius: 6px;\n  }\n  .page + .page{ margin-top: 28px; }\n\n  /* decorative arc lines like the hero on the website */\n  .page::before{\n    content:\"\";\n    position:absolute; inset:auto -60mm -120mm auto;\n    width: 360mm; height: 360mm;\n    border-radius: 50%;\n    border: 1px solid rgba(45,122,58,.10);\n    box-shadow:\n      0 0 0 22mm rgba(45,122,58,.0),\n      inset 0 0 0 22mm rgba(45,122,58,.04);\n    pointer-events:none;\n  }\n  .page::after{\n    content:\"\";\n    position:absolute; inset:-140mm auto auto -60mm;\n    width: 280mm; height: 280mm;\n    border-radius: 50%;\n    border: 1px solid rgba(45,122,58,.10);\n    pointer-events:none;\n  }\n\n  .inner{\n    position:relative;\n    padding: 22mm 22mm 24mm;\n  }\n\n  /* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 header \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n  .head{\n    display:flex;\n    align-items:flex-start;\n    justify-content:space-between;\n    gap: 24px;\n    padding-bottom: 14px;\n    border-bottom: 2px solid var(--brand);\n  }\n  .brand{\n    display:flex; align-items:center; gap: 14px;\n  }\n  .logo-mark{\n    width: 54px; height: 54px;\n    border-radius: 10px;\n    background: var(--brand);\n    color: #fff;\n    display:flex; align-items:center; justify-content:center;\n    position:relative;\n    font-family:'Be Vietnam Pro'; font-weight: 800; font-size: 26px; line-height:1;\n    letter-spacing: -0.02em;\n    box-shadow: inset 0 -3px 0 rgba(0,0,0,.18);\n  }\n  .logo-mark::after{\n    content:\"\";\n    position:absolute; left: 8px; right: 8px; bottom: 9px;\n    height: 3px; background: #fff; border-radius: 2px;\n  }\n  .brand-text .name{\n    font-weight: 700; font-size: 20px; letter-spacing: -0.01em;\n    color: var(--ink);\n  }\n  .brand-text .name span{ color: var(--brand); }\n  .brand-text .tag{\n    font-size: 11.5px; color: var(--ink-3);\n    letter-spacing: .14em; text-transform: uppercase;\n    margin-top: 4px;\n  }\n\n  .meta{\n    text-align: right;\n    font-size: 11.5px; color: var(--ink-2);\n    line-height: 1.55;\n  }\n  .meta .ref{\n    font-family:'JetBrains Mono', monospace;\n    font-size: 11px;\n    color: var(--ink);\n    background: var(--brand-soft);\n    border: 1px solid var(--brand-line);\n    border-radius: 999px;\n    padding: 3px 10px;\n    display:inline-block;\n    margin-bottom: 6px;\n  }\n\n  /* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 titles \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n  .preamble{\n    margin-top: 14mm;\n    text-align:center;\n  }\n  .preamble .country{\n    font-weight: 700;\n    font-size: 13px;\n    letter-spacing: .02em;\n    color: var(--ink);\n  }\n  .preamble .motto{\n    font-style: italic;\n    font-size: 12px;\n    color: var(--ink-2);\n    margin-top: 2px;\n  }\n  .preamble .rule{\n    width: 60px; height: 1.5px; background: var(--ink);\n    margin: 6px auto 0;\n  }\n\n  .doc-title{\n    margin-top: 14mm;\n    text-align:center;\n  }\n  .doc-title h1{\n    margin: 0;\n    font-size: 28px;\n    line-height: 1.15;\n    letter-spacing: -0.01em;\n    text-transform: uppercase;\n    color: var(--brand-deep);\n    font-weight: 800;\n  }\n  .doc-title .subject{\n    margin-top: 8px;\n    font-size: 14px;\n    color: var(--ink-2);\n    font-weight: 500;\n  }\n  .doc-title .subject b{ color: var(--ink); font-weight: 600; }\n\n  /* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 body \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n  .recipient{\n    margin-top: 12mm;\n    display: grid;\n    grid-template-columns: 130px 1fr;\n    row-gap: 6px;\n    column-gap: 14px;\n    font-size: 13px;\n    color: var(--ink);\n  }\n  .recipient .k{ color: var(--ink-3); font-weight: 500; }\n  .recipient .v{ color: var(--ink); font-weight: 500; }\n  .recipient .v .placeholder{\n    display:inline-block; min-width: 260px;\n    border-bottom: 1px dotted var(--ink-3);\n    color: var(--ink-3);\n  }\n\n  .body{\n    margin-top: 8mm;\n    font-size: 13.5px;\n    line-height: 1.7;\n    color: var(--ink);\n    text-align: justify;\n  }\n  .body p{ margin: 0 0 10px; }\n  .body .intro::first-letter{\n    font-weight: 700; color: var(--brand);\n  }\n  .body strong{ color: var(--ink); font-weight: 600; }\n  .body em{ color: var(--brand-deep); font-style: normal; font-weight: 600; }\n\n  /* stat strip mimicking the hero on the website */\n  .stats{\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: 10px;\n    margin: 14px 0 16px;\n  }\n  .stat{\n    border: 1px solid var(--brand-line);\n    background: var(--paper);\n    border-radius: 14px;\n    padding: 12px 14px;\n    position: relative;\n  }\n  .stat .label{\n    font-size: 10.5px;\n    color: var(--ink-3);\n    letter-spacing: .12em;\n    text-transform: uppercase;\n    font-weight: 600;\n  }\n  .stat .value{\n    font-size: 26px;\n    font-weight: 800;\n    color: var(--brand-deep);\n    letter-spacing: -0.02em;\n    line-height: 1.1;\n    margin-top: 4px;\n    font-variant-numeric: tabular-nums;\n  }\n  .stat .unit{\n    font-size: 11px;\n    color: var(--ink-2);\n    margin-top: 2px;\n  }\n  .stat .corner{\n    position:absolute; top: 10px; right: 12px;\n    width: 8px; height: 8px;\n    border-radius: 2px;\n    background: var(--brand);\n    opacity: .8;\n  }\n\n  /* benefits list */\n  .benefits{\n    margin: 6px 0 14px;\n    border-top: 1px dashed var(--brand-line);\n    border-bottom: 1px dashed var(--brand-line);\n    padding: 12px 0;\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 8px 22px;\n  }\n  .benefit{\n    display:flex; gap: 10px;\n    font-size: 12.5px; color: var(--ink);\n  }\n  .benefit .tick{\n    flex-shrink:0;\n    width: 18px; height: 18px; border-radius: 999px;\n    background: var(--brand-soft); color: var(--brand);\n    display:inline-flex; align-items:center; justify-content:center;\n    font-weight: 700; font-size: 12px;\n    margin-top: 1px;\n  }\n  .benefit b{ font-weight: 600; color: var(--ink); }\n  .benefit .d{ color: var(--ink-2); }\n\n  /* packages table */\n  .pkg-head{\n    margin-top: 6px;\n    font-size: 12px;\n    font-weight: 700;\n    color: var(--brand-deep);\n    letter-spacing: .14em;\n    text-transform: uppercase;\n  }\n  .pkg{\n    margin-top: 8px;\n    width: 100%;\n    border-collapse: separate;\n    border-spacing: 0;\n    font-size: 12.5px;\n  }\n  .pkg th, .pkg td{\n    text-align: left;\n    padding: 10px 12px;\n    border-bottom: 1px solid var(--rule);\n    vertical-align: top;\n  }\n  .pkg thead th{\n    background: var(--brand-soft);\n    color: var(--brand-deep);\n    font-weight: 700;\n    font-size: 11.5px;\n    letter-spacing: .04em;\n    text-transform: uppercase;\n    border-bottom: 1px solid var(--brand-line);\n  }\n  .pkg thead th:first-child{ border-top-left-radius: 8px; }\n  .pkg thead th:last-child{ border-top-right-radius: 8px; }\n  .pkg .name{ font-weight: 600; color: var(--ink); }\n  .pkg .slot{ color: var(--ink-2); }\n  .pkg .price{\n    font-weight: 700; color: var(--brand-deep);\n    font-variant-numeric: tabular-nums;\n    white-space: nowrap;\n  }\n  .pkg .price span{ font-weight: 500; color: var(--ink-3); font-size: 11px; }\n  .pkg .ribbon{\n    display: inline-block;\n    background: var(--accent);\n    color: #fff;\n    font-size: 10px;\n    font-weight: 600;\n    padding: 2px 6px;\n    border-radius: 4px;\n    margin-left: 6px;\n    letter-spacing: .04em;\n    vertical-align: middle;\n  }\n\n  /* call to action card */\n  .cta{\n    margin: 14px 0 4px;\n    border: 1px solid var(--brand-line);\n    background:\n      linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(233,243,235,.55) 100%),\n      var(--paper);\n    border-radius: 14px;\n    padding: 14px 16px;\n    display:flex;\n    align-items:center;\n    gap: 14px;\n  }\n  .cta .ic{\n    width: 38px; height: 38px;\n    border-radius: 10px;\n    background: var(--brand);\n    color: #fff;\n    display:flex; align-items:center; justify-content:center;\n    font-weight: 700; font-size: 18px;\n    flex-shrink: 0;\n  }\n  .cta .t{ font-size: 13px; }\n  .cta .t b{ color: var(--ink); font-weight: 600; }\n  .cta .t span{ color: var(--ink-2); }\n\n  /* signature */\n  .sign{\n    margin-top: 14mm;\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 24px;\n    font-size: 13px;\n  }\n  .sign .col .where{\n    color: var(--ink-2);\n    font-style: italic;\n    font-size: 12.5px;\n  }\n  .sign .col.r{ text-align: center; }\n  .sign .col.r .role{\n    font-weight: 700;\n    text-transform: uppercase;\n    letter-spacing: .04em;\n  }\n  .sign .col.r .note{\n    color: var(--ink-3);\n    font-size: 11.5px;\n    font-style: italic;\n    margin-top: 2px;\n  }\n  .sign .col.r .seal{\n    height: 60px;\n    display:flex; align-items:center; justify-content:center;\n    color: var(--brand);\n    opacity: .35;\n    margin: 4px 0 2px;\n  }\n  .sign .col.r .seal svg{ width: 90px; height: 90px; }\n  .sign .col.r .name{\n    font-weight: 700;\n    color: var(--ink);\n    font-size: 14px;\n  }\n  .sign .col.r .title{\n    font-size: 11.5px; color: var(--ink-2);\n    margin-top: 2px;\n  }\n\n  .cc{\n    margin-top: 12mm;\n    border-top: 1px dashed var(--rule);\n    padding-top: 8px;\n    font-size: 11px;\n    color: var(--ink-3);\n    line-height: 1.55;\n  }\n  .cc b{ color: var(--ink-2); font-weight: 600; }\n\n  /* footer */\n  .foot{\n    margin: 14mm -22mm -24mm;\n    padding: 14px 22mm 16px;\n    background: var(--brand-deep);\n    color: #cfe3d2;\n    font-size: 11px;\n    display: flex; align-items:center; justify-content: space-between; gap: 16px;\n  }\n  .foot .left b{ color: #fff; font-weight: 700; }\n  .foot .right{\n    display: flex; gap: 18px; flex-wrap: wrap;\n    font-variant-numeric: tabular-nums;\n  }\n  .foot .right span::before{\n    content:\"\";\n    display:inline-block;\n    width:5px; height:5px; border-radius:999px;\n    background: #7fbf8a; margin-right: 8px; vertical-align: middle;\n  }\n\n  /* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 print \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n  @page{ size: A4; margin: 0; }\n  @media print{\n    body{\n      background: #fff;\n      padding: 0;\n    }\n    .page{\n      width: 210mm;\n      min-height: 297mm;\n      margin: 0;\n      box-shadow: none;\n      border-radius: 0;\n      page-break-after: always;\n    }\n    .page:last-child{ page-break-after: auto; }\n    .print-hide{ display:none !important; }\n  }\n\n  /* print button (screen only) */\n  .toolbar{\n    position: fixed;\n    top: 16px; right: 16px;\n    z-index: 30;\n    display: flex; gap: 8px;\n  }\n  .toolbar button{\n    border: 1px solid var(--brand-line);\n    background: #fff;\n    color: var(--brand-deep);\n    font-family: inherit;\n    font-size: 12.5px;\n    font-weight: 600;\n    padding: 8px 14px;\n    border-radius: 999px;\n    cursor: pointer;\n    box-shadow: 0 1px 2px rgba(15,26,19,.05);\n    display: inline-flex; align-items: center; gap: 6px;\n  }\n  .toolbar button.primary{\n    background: var(--brand);\n    color: #fff;\n    border-color: var(--brand);\n  }\n  .toolbar button:hover{ transform: translateY(-\n  /* \u2500\u2500 1-page compact overrides \u2500\u2500 */\n  .inner{ padding: 11mm 18mm 0; }\n  .preamble{ margin-top: 7mm; }\n  .doc-title{ margin-top: 7mm; }\n  .doc-title h1{ font-size: 22px; }\n  .doc-title .subject{ font-size: 12.5px; margin-top: 4px; }\n  .recipient{ margin-top: 6mm; font-size: 12.5px; row-gap: 4px; }\n  .body{ margin-top: 4mm; font-size: 12.5px; }\n  .body p{ margin: 0 0 6px; }\n  .stats{ margin: 8px 0 8px; gap: 8px; }\n  .stat{ padding: 8px 11px; border-radius: 10px; }\n  .stat .value{ font-size: 20px; margin-top: 2px; }\n  .stat .label{ font-size: 10px; }\n  .stat .unit{ font-size: 10.5px; }\n  .benefits{ margin: 4px 0 8px; padding: 8px 0; gap: 5px 16px; }\n  .benefit{ font-size: 12px; }\n  .benefit .tick{ width:16px; height:16px; font-size:11px; }\n  .cta{ margin: 8px 0 0; padding: 10px 13px; }\n  .cta .ic{ width:32px; height:32px; font-size:16px; border-radius:8px; }\n  .cta .t{ font-size: 12.5px; }\n  .sign{ margin-top: 7mm; }\n  .sign .col.r .seal{ height: 40px; }\n  .sign .col.r .seal svg{ width: 65px; height: 65px; }\n  .sign .col.r .name{ font-size: 13px; }\n  .foot{ margin: 6mm -18mm 0; padding: 11px 18mm 13px; }\n</style></style>\n</head>\n<body>\n\n<div class=\"toolbar print-hide\">\n  <button onclick=\"window.print()\" class=\"primary\">\u2399 &nbsp;In / L\u01b0u PDF</button>\n</div>\n\n<!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 PAGE 1 \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n<article class=\"page\" data-screen-label=\"01 Letter \u2014 Page 1\">\n  <div class=\"inner\">\n\n    <!-- letterhead -->\n    <header class=\"head\">\n      <div class=\"brand\">\n        <img src=\"fafd40cd-0480-42f5-8023-0bc42876f6f2\" alt=\"t\u00e0is\u1ea3n\u0111\u1ea5ugi\u00e1\" style=\"height: 52px; width: auto; display: block;\" />\n      </div>\n      <div class=\"meta\">\n        <div>H\u00e0 N\u1ed9i, ng\u00e0y 21 th\u00e1ng 05 n\u0103m 2026</div>\n        <div style=\"color:var(--ink-3); margin-top:2px\">www.taisandaugia.vn \u00b7 vn.taisandaugia@gmail.com</div>\n      </div>\n    </header>\n\n    <!-- preamble -->\n    <div class=\"preamble\">\n      <div class=\"country\">C\u1ed8NG H\u00d2A X\u00c3 H\u1ed8I CH\u1ee6 NGH\u0128A VI\u1ec6T NAM</div>\n      <div class=\"motto\">\u0110\u1ed9c l\u1eadp \u2014 T\u1ef1 do \u2014 H\u1ea1nh ph\u00fac</div>\n      <div class=\"rule\"></div>\n    </div>\n\n    <!-- title -->\n    <div class=\"doc-title\">\n      <h1>Th\u01b0 m\u1eddi h\u1ee3p t\u00e1c qu\u1ea3ng c\u00e1o</h1>\n      <div class=\"subject\">\n        <b>V/v:</b> M\u1eddi \u0111\u0103ng t\u1ea3i th\u00f4ng tin qu\u1ea3ng c\u00e1o tr\u00ean n\u1ec1n t\u1ea3ng <em>t\u00e0is\u1ea3n\u0111\u1ea5ugi\u00e1</em>\n      </div>\n    </div>\n\n    <!-- recipient -->\n    <div class=\"recipient\">\n      <div class=\"k\">K\u00ednh g\u1eedi:</div>\n      <div class=\"v\"><b>C\u00f4ng ty \u0111\u1ea5u gi\u00e1 h\u1ee3p danh DVL</b></div>\n      <div class=\"k\">Ng\u01b0\u1eddi \u0111\u1ea1i di\u1ec7n:</div>\n      <div class=\"v\"><b>Nguy\u1ec5n V\u0103n M\u1ea1nh</b></div>\n      <div class=\"k\">\u0110\u1ecba ch\u1ec9:</div>\n      <div class=\"v\">Kh\u1ed1i nh\u00e0 A3, D\u1ef1 \u00e1n \u0111\u1ea7u t\u01b0 x\u00e2y d\u1ef1ng th\u00e1p Th\u1ee7 \u0110\u00f4 Xanh (TD Green Tower) t\u1ea1i m\u1ed9t ph\u1ea7n \u00f4 \u0111\u1ea5t CV6.9, ph\u01b0\u1eddng M\u1ec5 Tr\u00ec, Th\u00e0nh ph\u1ed1 H\u00e0 N\u1ed9i</div>\n    </div>\n\n    <!-- body -->\n    <section class=\"body\">\n      <p class=\"intro\">\n        <em>t\u00e0is\u1ea3n\u0111\u1ea5ugi\u00e1</em> l\u00e0 n\u1ec1n t\u1ea3ng t\u1ed5ng h\u1ee3p v\u00e0 ni\u00eam y\u1ebft th\u00f4ng tin phi\u00ean \u0111\u1ea5u gi\u00e1 t\u00e0i\n        s\u1ea3n c\u00f4ng khai tr\u00ean to\u00e0n qu\u1ed1c \u2014 k\u00eanh k\u1ebft n\u1ed1i tr\u1ef1c ti\u1ebfp gi\u1eefa T\u1ed5 ch\u1ee9c \u0111\u1ea5u gi\u00e1 v\u00e0 ng\u01b0\u1eddi\n        mua \u0111ang ch\u1ee7 \u0111\u1ed9ng t\u00ecm ki\u1ebfm t\u00e0i s\u1ea3n ph\u00f9 h\u1ee3p.\n      </p>\n\n<!-- company stats -->\n      <p style=\"margin-bottom: 6px;\">Trong 30 ng\u00e0y g\u1ea7n \u0111\u00e2y, h\u1ec7 th\u1ed1ng ghi nh\u1eadn ho\u1ea1t \u0111\u1ed9ng \u0111\u1ea5u gi\u00e1 c\u1ee7a Qu\u00fd c\u00f4ng ty:</p>\n      <div class=\"stats\">\n        <div class=\"stat\"><div class=\"corner\"></div>\n          <div class=\"label\">Cu\u1ed9c \u0111\u1ea5u gi\u00e1</div>\n          <div class=\"value\">XX</div>\n          <div class=\"unit\">Cu\u1ed9c \u0111\u00e3 t\u1ed5 ch\u1ee9c</div>\n        </div>\n        <div class=\"stat\"><div class=\"corner\"></div>\n          <div class=\"label\">T\u1ed5ng gi\u00e1 kh\u1edfi \u0111i\u1ec3m</div>\n          <div class=\"value\">XXX t\u1ef7</div>\n          <div class=\"unit\">Quy m\u00f4 t\u00e0i s\u1ea3n \u0111\u1ea5u gi\u00e1</div>\n        </div>\n        <div class=\"stat\" style=\"display:flex; flex-direction:column;\"><div class=\"corner\"></div>\n          <div class=\"label\">Nh\u00f3m t\u00e0i s\u1ea3n ch\u00ednh</div>\n          <div class=\"value\" style=\"font-size:15px; line-height:1.3; margin-top:6px; flex:1;\">B\u1ea5t \u0111\u1ed9ng s\u1ea3n</div>\n          <div class=\"unit\">XX% t\u1ed5ng s\u1ed1 phi\u00ean</div>\n        </div>\n      </div>\n\n            <p>\n        \u0110\u00e2y l\u00e0 d\u1eef li\u1ec7u ch\u00fang t\u00f4i ghi nh\u1eadn t\u1eeb ho\u1ea1t \u0111\u1ed9ng c\u00f4ng khai c\u1ee7a Qu\u00fd c\u00f4ng ty \u2014 nh\u01b0ng\n        ch\u00fang ch\u1ec9 th\u1ef1c s\u1ef1 t\u1ea1o gi\u00e1 tr\u1ecb khi xu\u1ea5t hi\u1ec7n tr\u01b0\u1edbc \u0111\u00fang ng\u01b0\u1eddi mua. Hi\u1ec7n t\u1ea1i, h\u1ed3 s\u01a1\n        c\u00f4ng ty tr\u00ean marketplace ch\u01b0a hi\u1ec3n th\u1ecb nh\u1eefng con s\u1ed1 n\u00e0y.\n      </p>\n\n      <p>\n        <em>Ch\u01b0\u01a1ng tr\u00ecnh H\u1ee3p t\u00e1c Qu\u1ea3ng c\u00e1o &amp; Ni\u00eam y\u1ebft \u01afu ti\u00ean 2026</em> gi\u00fap Qu\u00fd c\u00f4ng\n        ty bi\u1ebfn d\u1eef li\u1ec7u n\u00e0y th\u00e0nh l\u1ee3i th\u1ebf c\u1ea1nh tranh:\n      </p>\n\n      <!-- benefits -->\n      <div class=\"benefits\">\n        <div class=\"benefit\">\n          <span class=\"tick\">\u2713</span>\n          <div><b>Hi\u1ec3n th\u1ecb n\u1ed5i b\u1eadt tr\u00ean marketplace</b> <span class=\"d\">\u2014 xu\u1ea5t hi\u1ec7n \u01b0u ti\u00ean tr\u00ean s\u00e0n khi ch\u1ee7 t\u00e0i s\u1ea3n t\u00ecm \u0111\u1ed1i t\u00e1c.</span></div>\n        </div>\n        <div class=\"benefit\">\n          <span class=\"tick\">\u2713</span>\n          <div><b>Tick xanh \"\u0110\u00e3 x\u00e1c th\u1ef1c B\u1ed9 T\u01b0 ph\u00e1p\"</b> <span class=\"d\">\u2014 ph\u00e2n bi\u1ec7t r\u00f5 v\u1edbi \u0111\u01a1n v\u1ecb ch\u01b0a x\u00e1c th\u1ef1c, t\u0103ng \u0111\u1ed9 tin c\u1eady ngay t\u1eeb c\u00e1i nh\u00ecn \u0111\u1ea7u.</span></div>\n        </div>\n        <div class=\"benefit\">\n          <span class=\"tick\">\u2713</span>\n          <div><b>H\u1ed3 s\u01a1 n\u0103ng l\u1ef1c chuy\u00ean nghi\u1ec7p</b> <span class=\"d\">\u2014 trang gi\u1edbi thi\u1ec7u ri\u00eang tr\u00ean marketplace + file PDF xu\u1ea5t s\u1eb5n mang \u0111i pitching.</span></div>\n        </div>\n        <div class=\"benefit\">\n          <span class=\"tick\">\u2713</span>\n          <div><b>Ti\u1ebfp c\u1eadn \u0111\u00fang ng\u01b0\u1eddi mua \u0111ang ch\u1ee7 \u0111\u1ed9ng t\u00ecm t\u00e0i s\u1ea3n</b> <span class=\"d\">\u2014 k\u1ebft n\u1ed1i tr\u1ef1c ti\u1ebfp v\u1edbi t\u1eadp kh\u00e1ch h\u00e0ng c\u00f3 nhu c\u1ea7u, kh\u00f4ng qua trung gian.</span></div>\n        </div>\n      </div>\n\n      <div class=\"cta\">\n        <div class=\"ic\">\u2192</div>\n        <div class=\"t\">\n          <b>Qu\u00fd Doanh nghi\u1ec7p quan t\u00e2m?</b> &nbsp;\n          <span>Truy c\u1eadp <strong>taisandaugia.vn</strong> \u0111\u1ec3 xem chi ti\u1ebft c\u00e1c c\u01a1 h\u1ed9i h\u1ee3p t\u00e1c, ho\u1eb7c li\u00ean h\u1ec7 tr\u1ef1c ti\u1ebfp \u0111\u1ec3 \u0111\u01b0\u1ee3c t\u01b0 v\u1ea5n mi\u1ec5n ph\u00ed.</span>\n        </div>\n      </div>\n    </section>\n\n    <!-- signature -->\n    <div class=\"sign\" style=\"display:flex; justify-content:flex-end;\">\n      <div class=\"col r\">\n        <div class=\"name\">Nguy\u1ec5n V\u0103n Hi\u1ebfu</div>\n        <div class=\"title\">T\u1ed5ng gi\u00e1m \u0111\u1ed1c</div>\n      </div>\n    </div>\n\n  </div>\n</article>\n\n\n\n</body></html>"
