<style>
/* Layout: full-bleed 3D village; glass "ink" panels float over it — step card bottom-left, step rail right (top strip on phones). Single deliberate dark UI look over a daylight scene. */
:root{
  --ink:#121822;            /* cobalt-black, like undiluted men lam */
  --panel:rgba(18,24,34,.86);
  --paper:#f0e9db;          /* porcelain body */
  --muted:#a8aebb;
  --cobalt:#6f93ec;         /* men lam, lifted for dark ground */
  --cobalt-deep:#2f55b8;
  --ember:#f09a4a;          /* kiln heat, used only for temperature */
  --line:rgba(240,233,219,.14);
  --f-display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--f-body);overflow:hidden}
#app{position:fixed;inset:0}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}

.top{position:absolute;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;pointer-events:none}
.top > *{pointer-events:auto}
.brand{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:8px 14px 10px}
.brand small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.brand strong{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:26px;line-height:1.05}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:background .2s,border-color .2s}
.btn:hover{border-color:rgba(240,233,219,.35)}
.btn.primary{background:var(--cobalt-deep);border-color:var(--cobalt-deep);color:#fff}
.btn.primary:hover{background:#3a63cc}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;backdrop-filter:blur(10px)}
.seg button{background:none;border:0;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}

.rail{position:absolute;right:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:10px}
.rail button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:8px;padding:6px 10px 6px 6px;text-align:left;font-size:13px;color:var(--muted);white-space:nowrap}
.rail button:hover{color:var(--paper);background:rgba(240,233,219,.06)}
.rail .n{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;flex:none}
.rail button.seen .n{border-color:var(--cobalt);color:var(--cobalt)}
.rail button.on{color:var(--paper);background:rgba(111,147,236,.16)}
.rail button.on .n{background:var(--cobalt);border-color:var(--cobalt);color:var(--ink)}

.card{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(430px,calc(100% - 32px));background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:18px 20px 16px;display:flex;flex-direction:column;gap:12px;max-height:calc(100% - 120px);overflow:auto}
.kicker{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cobalt);font-weight:600}
.kicker .min{display:none;background:none;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:11px;letter-spacing:.04em;text-transform:none;color:var(--muted)}
.card h1{font-family:var(--f-display);font-weight:600;font-size:32px;line-height:1.05;margin:0;text-wrap:balance}
.card .body{margin:0;font-size:14px;line-height:1.6;color:#d9d3c6;max-width:62ch}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45;color:var(--muted);transition:color .3s}
.steps li::before{content:"";flex:none;width:9px;height:9px;margin-top:5px;border-radius:50%;border:1.5px solid currentColor;transition:background .3s}
.steps li.act{color:var(--paper)}
.steps li.act::before{border-color:var(--cobalt);box-shadow:0 0 0 3px rgba(111,147,236,.2)}
.steps li.done{color:#cfc9bc}
.steps li.done::before{background:var(--cobalt);border-color:var(--cobalt)}
.fact{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:10px;font-size:12.5px}
.fact span:first-child{color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-size:11px;padding-top:2px}
.fact span:last-child{text-align:right;font-weight:500}
.gauge{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)}
.gauge b{font-family:var(--f-display);font-size:34px;font-weight:600;color:var(--ember);font-variant-numeric:tabular-nums;line-height:1}
.bar{height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--cobalt)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{background:rgba(240,233,219,.06)}
.row .btn.primary{background:var(--cobalt-deep);margin-left:auto}
.hint{font-size:11.5px;color:var(--muted);margin:0}

.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--ink);z-index:5;text-align:center;padding-inline:16px}
.loading p{font-family:var(--f-display);font-style:italic;font-size:24px;margin:0 0 6px}
.loading small{color:var(--muted)}
.toast{position:absolute;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px;max-width:calc(100% - 32px)}

@media (max-width:760px){
  .brand strong{font-size:21px}
  .rail{top:auto;transform:none;left:16px;right:16px;bottom:auto;top:calc(118px + env(safe-area-inset-top,0px));flex-direction:row;overflow-x:auto;padding:6px;gap:4px;border-radius:12px}
  .rail button{padding:4px 8px 4px 4px;font-size:12px}
  .rail .n{width:22px;height:22px}
  .card{padding:14px 16px 12px;gap:10px;max-height:52%}
  .card h1{font-size:26px}
  .kicker .min{display:inline-block}
  .card.collapsed .body,.card.collapsed .steps,.card.collapsed .fact,.card.collapsed .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  const fr=mk(new THREE.ExtrudeGeometry(frame,{depth:.08,bevelEnabled:false,curveSegments:20}),M.brick,g,0,.05,.6);
  const light=new THREE.PointLight(0xff7b2e,0,7,2); light.position.set(0,.8,1.1); g.add(light);
  const sag=[[1.95,.3,3],[2.4,-.3,2],[-1.95,.35,3],[-2.35,-.25,1]];
  for(const [x,z,n] of sag) for(let k=0;k<n;k++) mk(G.cyl(.23,.23,.27,24),M.saggar,g,x,.135+k*.28,z);
  for(let i=0;i<14;i++){const c=mk(new THREE.DodecahedronGeometry(rnd(.06,.11)),std({color:0x1d1b1a,roughness:.6}),g,rnd(-1.2,-.6),.05,rnd(.9,1.4));c.rotation.set(rnd(0,3),rnd(0,3),0);}
  const smokeMat=[]; const smoke=[];
  const puff=tex(64,64,(c)=>{const r=c.createRadialGradient(32,32,2,32,32,30);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=r;c.fillRect(0,0,64,64);});
  for(let i=0;i<14;i++){const m=new THREE.SpriteMaterial({map:puff,color:0x8f8983,transparent:true,opacity:0,depthWrite:false});const s=new THREE.Sprite(m);s.userData.o=i/14;g.add(s);smoke.push(s);}
  const cA=new THREE.Color(0x1a1210), cB=new THREE.Color(0xff8a2a), cC=new THREE.Color(0xffd08a);
  return {update(p,t){
    const heat=sm(p,0,.8)*(1-sm(p,.9,1)*.35);
    const fl=.88+.12*Math.sin(t*13)*Math.sin(t*7.3);
    glow.color.copy(cA).lerp(cB,clamp(heat*1.2)*fl).lerp(cC,clamp(heat-.7)*fl);
    light.intensity=heat*14*fl;
    smoke.forEach(s=>{const u=(t*.18+s.userData.o)%1; s.position.set(Math.sin(u*6+s.userData.o*9)*.3*u,5.2+u*3.2,-1.45+u*.6); s.scale.setScalar(.5+u*1.8); s.material.opacity=(1-u)*.55*sm(p,.1,.4);});
    STATE.temp=25+heat*1225;
  }};
}
function stDone(g){
  mk(G.box(2.9,1.9,.06),M.darkWood,g,0,.95,-.75);
  for(const x of [-1.42,1.42]) mk(G.box(.06,1.9,.5),M.darkWood,g,x,.95,-.5);
  for(const y of [.5,1.0,1.5]) mk(G.box(2.8,.04,.48),M.wood,g,0,y,-.5);
  const celadon=glossy({color:0x9dbfa4}), brown=glossy({color:0x5e331b,roughness:.25}), crackle=glossy({map:crackleTex,roughness:.3}), bw=glossy({map:firedTex});
  const put=(pts,mat,x,y,s=1,rz=0)=>{const m=mk(lathe(pts),mat,g,x,y,-.5);m.scale.setScalar(s);m.rotation.x=rz;return m;};
  put(BOWL,celadon,-1.0,.52,1.2); put(BOWL,celadon,-.62,.52,1.0); put(JAR,brown,-.1,.52,1.0); put(VASE,crackle,.5,.52,.85); put(JAR,bw,1.0,.52,.8);
  const pl1=put(PLATE,bw,-.9,1.22,1.0,Math.PI/2*.82); pl1.position.z=-.62;
  const pl2=put(PLATE,celadon,-.35,1.2,.9,Math.PI/2*.82); pl2.position.z=-.62;
  for(let k=0;k<4;k++) put(CUP,k%2?bw:crackle,.2+k*.22,1.02,1.4);
  put(VASE,brown,1.0,1.02,.8); put(VASE,celadon,-1.05,1.52,.7); put(BOWL,bw,-.45,1.52,1); put(JAR,crackle,.2,1.52,.8); put(VASE,bw,.9,1.52,.7);
  mk(G.cyl(.26,.3,.8,32),M.porcelain,g,0,.4,.7);
  const hero=mk(heroGeo,glossy({map:firedTex}),g,0,.8,.7);
  const ringMat=new THREE.MeshBasicMaterial({color:0x6f93ec,transparent:true,opacity:0,side:DS,depthWrite:false});
  const ring=mk(new THREE.RingGeometry(.2,.215,48),ringMat,g,0,1.0,.7,{cast:false});
  const mallet=mk(G.cyl(.01,.01,.2,8),M.wood,g,.3,1.0,.7); mallet.rotation.z=1.2;
  const spot=new THREE.PointLight(0xfff0d8,0,3,2); spot.position.set(.5,1.6,1.4); g.add(spot);
  return {update(p,t){
    hero.rotation.y=sm(p,0,1)*Math.PI*2+t*.15;
    const tap=sm(p,.25,.6); ringMat.opacity=p>.25&&p<.62?(1-((t*1.6)%1))*.8:0;
    const s=1+((t*1.6)%1)*1.4; ring.scale.set(s,s,s); ring.rotation.x=Math.PI/2;
    mallet.visible=p>.2&&p<.65; mallet.position.x=.28+Math.max(0,Math.sin(t*10))*.05;
    spot.intensity=sm(p,.5,1)*3;
  }};
}
const BUILD=[stClay,stWheel,stDry,stPaint,stGlaze,stKiln,stDone];

/* ------------------------------------------------------------------ village */
const STATE={temp:25};
mk(new THREE.PlaneGeometry(120,120),M.ground,scene,0,0,0,{cast:false}).rotation.x=-Math.PI/2;
const sky=new THREE.Mesh(new THREE.SphereGeometry(140,32,16),new THREE.MeshBasicMaterial({map:skyTex,side:THREE.BackSide,fog:false}));
scene.add(sky);
// centre: well + young banyan
mk(G.cyl(.85,.9,.7,28,true),std({map:wallTex,side:DS}),scene,0,.35,0);
mk(new THREE.CircleGeometry(.84,28),std({color:0x28343a,roughness:.05,envMapIntensity:1}),scene,0,.45,0).rotation.x=-Math.PI/2;
mk(G.cyl(.25,.4,3.2,12),M.trunk,scene,2.4,1.6,-1.2);
[[2.4,3.9,-1.2,1.7],[1.4,3.5,-.7,1.1],[3.3,3.6,-1.6,1.2],[2.3,4.6,-1.5,1.2]].forEach(([x,y,z,r],i)=>mk(new THREE.IcosahedronGeometry(r,1),i%2?M.leaf:M.leaf2,scene,x,y,z));

const R=8.8, stations=[], markers=[];
function roofGeo(w,d){const s=new THREE.Shape();s.moveTo(-d/2-.4,0);s.lineTo(d/2+.4,0);s.lineTo(0,1.5);s.lineTo(-d/2-.4,0);const g=new THREE.ExtrudeGeometry(s,{depth:w+.6,bevelEnabled:false});g.center();g.rotateY(Math.PI/2);return g;}
function markerTex(n){return tex(128,128,(c)=>{c.fillStyle='#2f55b8';c.beginPath();c.arc(64,64,54,0,7);c.fill();c.strokeStyle='#f0e9db';c.lineWidth=6;c.stroke();c.fillStyle='#f0e9db';c.font='600 64px "Be Vietnam Pro",sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(n,64,68);});}
for(let i=0;i<7;i++){
  const a=i/7*Math.PI*2;
  const g=new THREE.Group(); g.position.set(Math.sin(a)*R,0,Math.cos(a)*R); g.rotation.y=a+Math.PI; scene.add(g);
  mk(G.box(6.4,2.5,.3),i%2?M.coal:M.wall,g,0,1.25,-2.4);
  mk(G.box(5.4,3,3.6),M.plaster,g,0,1.5,-4.9);
  mk(roofGeo(5.4,3.6),M.roof,g,0,3.75,-4.9);
  const s=BUILD[i](g); s.update(0,0,0);
  const m=new THREE.Sprite(new THREE.SpriteMaterial({map:markerTex(String(i+1)),depthTest:false}));
  m.position.set(0,2.9,0); m.scale.setScalar(.8); m.userData.i=i; g.add(m); markers.push(m);
  stations.push({g,s,a});
  // between stations: stacked big jars (chum) and a shrub
  const b=a+Math.PI/7, x=Math.sin(b)*(R+.6), z=Math.cos(b)*(R+.6);
  const jar=mk(lathe(JAR),std({color:0x6a3b22,roughness:.4,envMapIntensity:.7,side:DS}),scene,x,0,z); jar.scale.setScalar(3.2);
  const j2=mk(lathe(JAR),std({color:0x7b4a2a,roughness:.4,envMapIntensity:.7,side:DS}),scene,x+Math.cos(b)*1.1,0,z-Math.sin(b)*1.1); j2.scale.setScalar(2.4);
  mk(new THREE.IcosahedronGeometry(.8,1),M.leaf,scene,Math.sin(b)*(R+2.4),.6,Math.cos(b)*(R+2.4));
}
function viewFor(i,vr){
  const st=stations[i], v=STEPS[i].view, portrait=camera.aspect<.9;
  const d=vr?Math.min(v.d,2.4):v.d*(portrait?1.45:1);
  const dx=(!vr&&!portrait&&innerWidth>760)?-.28*d:0; // nudge subject right of the step card on wide screens
  const pos=new THREE.Vector3(dx,vr?0:v.h+(portrait?.25:0),d), tgt=new THREE.Vector3(dx,v.ty-(portrait?.35:0),0);
  st.g.localToWorld(pos); st.g.localToWorld(tgt); return {pos,tgt};
}

/* ------------------------------------------------------------------ VR panel */
const vrCanvas=document.createElement('canvas'); vrCanvas.width=1024; vrCanvas.height=700;
const vrTex=new THREE.CanvasTexture(vrCanvas); vrTex.colorSpace=SRGB;
const vrPanel=new THREE.Mesh(new THREE.PlaneGeometry(1.1,.75),new THREE.MeshBasicMaterial({map:vrTex,transparent:true}));
vrPanel.visible=false; scene.add(vrPanel);
function wrap(c,text,x,y,mw,lh){const words=text.split(' ');let line='';for(const w of words){const t=line?line+' '+w:w;if(c.measureText(t).width>mw&&line){c.fillText(line,x,y);y+=lh;line=w;}else line=t;}if(line){c.fillText(line,x,y);y+=lh;}return y;}
function drawVR(){
  const c=vrCanvas.getContext('2d'), W=1024, H=700, u=UI[lang];
  c.clearRect(0,0,W,H); c.fillStyle='rgba(18,24,34,.92)'; c.beginPath(); c.roundRect(0,0,W,H,36); c.fill();
  if(cur<0){c.fillStyle='#f0e9db';c.font='italic 600 64px "Cormorant Garamond",serif';c.fillText(u.introTitle,56,110);c.font='30px "Be Vietnam Pro",sans-serif';c.fillStyle='#d9d3c6';wrap(c,u.introBody,56,180,910,46);vrTex.needsUpdate=true;return;}
  const s=STEPS[cur][lang];
  c.fillStyle='#6f93ec'; c.font='600 24px "Be Vietnam Pro",sans-serif'; c.fillText(`${u.step.toUpperCase()} ${cur+1} / 7  ·  ${s.name.toUpperCase()}`,56,72);
  c.fillStyle='#f0e9db'; c.font='600 62px "Cormorant Garamond",serif'; c.fillText(s.title,56,142);
  c.font='26px "Be Vietnam Pro",sans-serif'; c.fillStyle='#d9d3c6'; let y=wrap(c,s.body,56,196,912,38)+10;
  s.steps.forEach((t,k)=>{const done=prog>=(k+1)/3, act=prog>k/3; c.fillStyle=done?'#6f93ec':act?'#f0e9db':'#6b7280'; c.beginPath(); c.arc(68,y-9,9,0,7); done?c.fill():(c.lineWidth=3,c.strokeStyle=c.fillStyle,c.stroke()); c.fillStyle=act||done?'#f0e9db':'#a8aebb'; c.fillText(t,94,y); y+=42;});
  if(STEPS[cur].gauge){c.fillStyle='#f09a4a';c.font='600 48px "Cormorant Garamond",serif';c.fillText(fmtTemp(),56,y+34);}
  c.fillStyle='rgba(240,233,219,.14)'; c.fillRect(56,H-78,912,6); c.fillStyle='#6f93ec'; c.fillRect(56,H-78,912*prog,6);
  c.fillStyle='#a8aebb'; c.font='22px "Be Vietnam Pro",sans-serif'; c.fillText(u.vrHint,56,H-34);
  vrTex.needsUpdate=true;
}
function placeVRPanel(i){
  const st=stations[i]; const p=new THREE.Vector3(-1.45,1.45,1.25); st.g.add(vrPanel); vrPanel.position.copy(p);
  vrPanel.rotation.set(0,Math.atan2(0-p.x,2.2-p.z),0); vrPanel.visible=true;
}

/* ------------------------------------------------------------------ tour logic */
let cur=-1, prog=0, playing=false, tween=null, seen=new Set();
const DUR=7.5;
function tweenCam(pos,tgt,d=1.8,done){tween={p0:camera.position.clone(),t0:controls.target.clone(),p1:pos,t1:tgt,s:0,d,done};}
function goTo(i){
  cur=i; playing=false; prog=0;
  markers.forEach(m=>m.visible=i<0);
  if(i<0){ if(!renderer.xr.isPresenting) tweenCam(OV_POS.clone(),OV_TGT.clone(),2); renderAll(); return; }
  seen.add(i); stations[i].s.update(0,clock.elapsedTime,0);
  renderAll();
  if(renderer.xr.isPresenting){ placeRig(i); setTimeout(()=>{if(cur===i)playing=true;},600); }
  else { const v=viewFor(i); tweenCam(v.pos,v.tgt,1.8,()=>{ if(cur===i) playing=true; }); }
}
function replay(){ if(cur<0) return; prog=0; stations[cur].s.update(0,clock.elapsedTime,0); playing=true; }
function placeRig(i){
  const v=viewFor(i,true); const d=v.tgt.clone().sub(v.pos);
  rig.position.set(v.pos.x,0,v.pos.z); rig.rotation.set(0,Math.atan2(-d.x,-d.z),0);
  placeVRPanel(i); drawVR();
}
const fmtTemp=()=>Math.round(STATE.temp).toLocaleString(lang==='vi'?'vi-VN':'en-US')+' °C';

/* ------------------------------------------------------------------ DOM UI */
const card=$('#card'), rail=$('#rail');
function renderAll(){
  const u=UI[lang];
  document.documentElement.lang=lang;
  $('#lang-vi').setAttribute('aria-pressed',lang==='vi'); $('#lang-en').setAttribute('aria-pressed',lang==='en');
  $('#b-kicker').textContent=u.kicker; $('#b-title').textContent=u.brand; $('#overview').textContent=u.overview;
  $('#vr').textContent=renderer.xr.isPresenting?u.vrExit:u.vr;
  rail.innerHTML=STEPS.map((s,i)=>`<button data-i="${i}" class="${i===cur?'on':''} ${seen.has(i)?'seen':''}"><span class="n">${i+1}</span>${s[lang].name}</button>`).join('');
  const collapsed=card.classList.contains('collapsed');
  const minBtn=`<button class="min" id="min">${collapsed?u.expand:u.collapse}</button>`;
  if(cur<0){
    card.innerHTML=`<div class="kicker"><span>${u.kicker} · ${u.intro7}</span>${minBtn}</div><h1>${u.introTitle}</h1><p class="body">${u.introBody}</p><p class="hint">${u.introHint}</p><div class="row"><button class="btn primary" id="start">${u.start} →</button></div>`;
  } else {
    const s=STEPS[cur][lang];
    card.innerHTML=`<div class="kicker"><span>${u.step} ${cur+1} / 7 · ${s.name}</span>${minBtn}</div>
      <h1>${s.title}</h1><p class="body">${s.body}</p>
      <ul class="steps">${s.steps.map(t=>`<li>${t}</li>`).join('')}</ul>
      ${STEPS[cur].gauge?`<div class="gauge"><span>${u.temp}</span><b id="temp">${fmtTemp()}</b></div>`:''}
      <div class="fact"><span>${s.fact[0]}</span><span>${s.fact[1]}</span></div>
      <div class="bar"><i id="bar"></i></div>
      <div class="row"><button class="btn" id="prev" ${cur===0?'disabled':''}>← ${u.prev}</button><button class="btn" id="again">↻ ${u.replay}</button><button class="btn primary" id="next">${cur===6?u.toOverview:u.next+' →'}</button></div>`;
  }
  lastLive=-1; live();
  if(renderer.xr.isPresenting) drawVR();
}
let lastLive=-1;
function live(){
  if(cur<0) return;
  const k=Math.round(prog*200); if(k===lastLive && !STEPS[cur].gauge) return; lastLive=k;
  const bar=$('#bar'); if(bar) bar.style.width=(prog*100)+'%';
  card.querySelectorAll('.steps li').forEach((li,j)=>{li.classList.toggle('done',prog>=(j+1)/3-1e-6&&prog>0);li.classList.toggle('act',prog>j/3&&prog<(j+1)/3);});
  const t=$('#temp'); if(t) t.textContent=fmtTemp();
}
card.addEventListener('click',e=>{
  const id=e.target.closest('button')?.id;
  if(id==='start') goTo(0);
  else if(id==='prev'&&cur>0) goTo(cur-1);
  else if(id==='next') goTo(cur===6?-1:cur+1);
  else if(id==='again') replay();
  else if(id==='min'){card.classList.toggle('collapsed'); renderAll();}
});
rail.addEventListener('click',e=>{const b=e.target.closest('button'); if(b) goTo(+b.dataset.i);});
$('#overview').onclick=()=>goTo(-1);
const setLang=l=>{lang=l;try{localStorage.setItem('bt-lang',l);}catch(e){} renderAll();};
$('#lang-vi').onclick=()=>setLang('vi'); $('#lang-en').onclick=()=>setLang('en');
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') goTo(cur>=6?-1:cur+1);
  else if(e.key==='ArrowLeft') goTo(Math.max(-1,cur-1));
  else if(e.key==='r'||e.key==='R') replay();
});
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,5000);}

// click markers in overview
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(); let down=null;
canvas.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
canvas.addEventListener('pointerup',e=>{
  if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6||cur>=0) return;
  const r=canvas.getBoundingClientRect(); ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(ndc,camera); const h=ray.intersectObjects(markers); if(h.length) goTo(h[0].object.userData.i);
});

/* ------------------------------------------------------------------ WebXR */
const vrBtn=$('#vr'); let xrOK=false, savedCam=null;
(async()=>{ try{ xrOK=!!(navigator.xr&&await navigator.xr.isSessionSupported('immersive-vr')); }catch(e){ xrOK=false; } vrBtn.classList.toggle('primary',xrOK); })();
vrBtn.onclick=async()=>{
  if(renderer.xr.isPresenting){ renderer.xr.getSession().end(); return; }
  if(!xrOK){ toast(UI[lang].vrNo); return; }
  try{
    const session=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor']});
    renderer.xr.setReferenceSpaceType('local-floor');
    savedCam={p:camera.position.clone(),t:controls.target.clone()};
    await renderer.xr.setSession(session);
    controls.enabled=false; tween=null;
    session.addEventListener('end',()=>{
      rig.position.set(0,0,0); rig.rotation.set(0,0,0); vrPanel.visible=false; controls.enabled=true;
      if(savedCam){camera.position.copy(savedCam.p); controls.target.copy(savedCam.t);} renderAll(); goTo(cur);
    });
    if(cur<0) goTo(0); else { placeRig(cur); replay(); }
    renderAll();
  }catch(e){ toast(UI[lang].vrFail); }
};
for(let k=0;k<2;k++){
  const c=renderer.xr.getController(k);
  c.addEventListener('selectstart',()=>goTo(cur>=6?0:cur+1));
  c.addEventListener('squeezestart',()=>goTo(Math.max(0,cur-1)));
  const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3(0,0,-1)]),new THREE.LineBasicMaterial({color:0x6f93ec}));
  line.scale.z=2.5; c.add(line); rig.add(c);
}

/* ------------------------------------------------------------------ loop */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w/h<.9?72:55;camera.updateProjectionMatrix();}
addEventListener('resize',resize); resize();
const clock=new THREE.Clock(); let vrTick=0, first=true;
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  if(tween){ tween.s+=dt/tween.d; const f=ease(clamp(tween.s));
    camera.position.lerpVectors(tween.p0,tween.p1,f); controls.target.lerpVectors(tween.t0,tween.t1,f);
    if(tween.s>=1){const d=tween.done; tween=null; d&&d();} }
  if(cur>=0){
    if(playing){ prog=Math.min(1,prog+dt/DUR); if(prog>=1) playing=false; }
    stations[cur].s.update(prog,t,dt); live();
    if(renderer.xr.isPresenting && (vrTick+=dt)>.25){vrTick=0; drawVR();}
  }
  if(controls.enabled){ if(controls.target.length()>16) controls.target.setLength(16); controls.update(); }
  renderer.render(scene,camera);
  if(first){first=false; $('#loading').hidden=true;}
});
renderAll();
document.fonts&&document.fonts.ready.then(()=>{ markers.forEach((m,i)=>{m.material.map=markerTex(String(i+1));}); });
</script>

</body></html>
