<style>
/* Layout: full-bleed 3D village; glass panels float over it — step card bottom-left, step rail right (top strip on phones). Single deliberate dark UI look, tinted like bamboo shade, over a daylight scene. */
:root{
  --ink:#121a15;            /* shade under a bamboo grove */
  --panel:rgba(18,26,21,.86);
  --paper:#f1ecd9;          /* ironed palm leaf */
  --muted:#aab3a6;
  --leaf:#a9cc84;           /* young lá lụi, accent */
  --leaf-deep:#3d6b36;
  --silk:#ef7d8f;           /* quai lụa, used only for live counters */
  --line:rgba(241,236,217,.14);
  --f-display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--f-body);overflow:hidden}
#app{position:fixed;inset:0}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}

.top{position:absolute;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;pointer-events:none}
.top > *{pointer-events:auto}
.brand{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:8px 14px 10px}
.brand small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.brand strong{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:26px;line-height:1.05}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:background .2s,border-color .2s}
.btn:hover{border-color:rgba(241,236,217,.35)}
.btn.primary{background:var(--leaf-deep);border-color:var(--leaf-deep);color:#fff}
.btn.primary:hover{background:#4a7d41}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;backdrop-filter:blur(10px)}
.seg button{background:none;border:0;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}

.rail{position:absolute;right:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:10px}
.rail button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:8px;padding:6px 10px 6px 6px;text-align:left;font-size:13px;color:var(--muted);white-space:nowrap}
.rail button:hover{color:var(--paper);background:rgba(241,236,217,.06)}
.rail .n{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;flex:none}
.rail button.seen .n{border-color:var(--leaf);color:var(--leaf)}
.rail button.on{color:var(--paper);background:rgba(169,204,132,.15)}
.rail button.on .n{background:var(--leaf);border-color:var(--leaf);color:var(--ink)}

.card{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(430px,calc(100% - 32px));background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:18px 20px 16px;display:flex;flex-direction:column;gap:12px;max-height:calc(100% - 120px);overflow:auto}
.kicker{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--leaf);font-weight:600}
.kicker .min{display:none;background:none;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:11px;letter-spacing:.04em;text-transform:none;color:var(--muted)}
.card h1{font-family:var(--f-display);font-weight:600;font-size:32px;line-height:1.05;margin:0;text-wrap:balance}
.card .body{margin:0;font-size:14px;line-height:1.6;color:#dcd8c8;max-width:62ch}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45;color:var(--muted);transition:color .3s}
.steps li::before{content:"";flex:none;width:9px;height:9px;margin-top:5px;border-radius:50%;border:1.5px solid currentColor;transition:background .3s}
.steps li.act{color:var(--paper)}
.steps li.act::before{border-color:var(--leaf);box-shadow:0 0 0 3px rgba(169,204,132,.2)}
.steps li.done{color:#d0cdbd}
.steps li.done::before{background:var(--leaf);border-color:var(--leaf)}
.fact{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:10px;font-size:12.5px}
.fact span:first-child{color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-size:11px;padding-top:2px}
.fact span:last-child{text-align:right;font-weight:500}
.gauge{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)}
.gauge b{font-family:var(--f-display);font-size:34px;font-weight:600;color:var(--silk);font-variant-numeric:tabular-nums;line-height:1}
.bar{height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--leaf)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{background:rgba(241,236,217,.06)}
.row .btn.primary{background:var(--leaf-deep);margin-left:auto}
.hint{font-size:11.5px;color:var(--muted);margin:0}

.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--ink);z-index:5;text-align:center;padding-inline:16px}
.loading p{font-family:var(--f-display);font-style:italic;font-size:24px;margin:0 0 6px}
.loading small{color:var(--muted)}
.toast{position:absolute;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px;max-width:calc(100% - 32px)}

@media (max-width:760px){
  .brand strong{font-size:21px}
  .rail{top:auto;transform:none;left:16px;right:16px;bottom:auto;top:calc(118px + env(safe-area-inset-top,0px));flex-direction:row;overflow-x:auto;padding:6px;gap:4px;border-radius:12px}
  .rail button{padding:4px 8px 4px 4px;font-size:12px}
  .rail .n{width:22px;height:22px}
  .card{padding:14px 16px 12px;gap:10px;max-height:52%}
  .card h1{font-size:26px}
  .kicker .min{display:inline-block}
  .card.collapsed .body,.card.collapsed .steps,.card.collapsed .fact,.card.collapsed .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

}

  // between stations: straw stacks and leaning woven trays
  const b=a+Math.PI/N, x=Math.sin(b)*(R+.8), z=Math.cos(b)*(R+.8);
  mk(G.cyl(.7,.75,1.1,16),M.straw,scene,x,.55,z); mk(new THREE.ConeGeometry(.8,.9,16),M.straw,scene,x,1.55,z);
  const tray=mk(G.cyl(.45,.45,.03,24),std({map:wickerTex,color:0xc9a66a}),scene,x+Math.cos(b)*1.2,.45,z-Math.sin(b)*1.2); tray.rotation.set(1.2,b,0);
}
function viewFor(i,vr){
  const st=stations[i], v=STEPS[i].view, portrait=camera.aspect<.9;
  const d=vr?Math.max(1.2,Math.min(v.d,2.2)):v.d*(portrait?1.45:1);
  const dx=(!vr&&!portrait&&innerWidth>760)?-.28*d:0;
  const pos=new THREE.Vector3(dx,vr?0:v.h+(portrait?.2:0),d), tgt=new THREE.Vector3(dx,v.ty-(portrait?.25*v.d/3:0),0);
  st.g.localToWorld(pos); st.g.localToWorld(tgt); return {pos,tgt};
}

/* ------------------------------------------------------------------ VR panel */
const vrCanvas=document.createElement('canvas'); vrCanvas.width=1024; vrCanvas.height=700;
const vrTex=new THREE.CanvasTexture(vrCanvas); vrTex.colorSpace=SRGB;
const vrPanel=new THREE.Mesh(new THREE.PlaneGeometry(1.1,.75),new THREE.MeshBasicMaterial({map:vrTex,transparent:true}));
vrPanel.visible=false; scene.add(vrPanel);
function wrap(c,text,x,y,mw,lh){const words=text.split(' ');let line='';for(const w of words){const t=line?line+' '+w:w;if(c.measureText(t).width>mw&&line){c.fillText(line,x,y);y+=lh;line=w;}else line=t;}if(line){c.fillText(line,x,y);y+=lh;}return y;}
function drawVR(){
  const c=vrCanvas.getContext('2d'), W=1024, H=700, u=UI[lang];
  c.clearRect(0,0,W,H); c.fillStyle='rgba(18,26,21,.92)'; c.beginPath(); c.roundRect(0,0,W,H,36); c.fill();
  if(cur<0){c.fillStyle='#f1ecd9';c.font='italic 600 64px "Cormorant Garamond",serif';c.fillText(u.introTitle,56,110);c.font='30px "Be Vietnam Pro",sans-serif';c.fillStyle='#dcd8c8';wrap(c,u.introBody,56,180,910,46);vrTex.needsUpdate=true;return;}
  const s=STEPS[cur][lang];
  c.fillStyle='#a9cc84'; c.font='600 24px "Be Vietnam Pro",sans-serif'; c.fillText(`${u.step.toUpperCase()} ${cur+1} / ${N}  ·  ${s.name.toUpperCase()}`,56,72);
  c.fillStyle='#f1ecd9'; c.font='600 60px "Cormorant Garamond",serif'; c.fillText(s.title,56,142);
  c.font='25px "Be Vietnam Pro",sans-serif'; c.fillStyle='#dcd8c8'; let y=wrap(c,s.body,56,194,912,36)+8;
  s.steps.forEach((t,k)=>{const done=prog>=(k+1)/3, act=prog>k/3; c.fillStyle=done?'#a9cc84':act?'#f1ecd9':'#6b7568'; c.beginPath(); c.arc(68,y-9,9,0,7); done?c.fill():(c.lineWidth=3,c.strokeStyle=c.fillStyle,c.stroke()); c.fillStyle=act||done?'#f1ecd9':'#aab3a6'; c.fillText(t,94,y); y+=40;});
  if(STEPS[cur].gauge){c.fillStyle='#ef7d8f';c.font='600 46px "Cormorant Garamond",serif';c.fillText(`${u[STEPS[cur].gauge]}: ${STATE.count} / 16`,56,y+30);}
  c.fillStyle='rgba(241,236,217,.14)'; c.fillRect(56,H-78,912,6); c.fillStyle='#a9cc84'; c.fillRect(56,H-78,912*prog,6);
  c.fillStyle='#aab3a6'; c.font='22px "Be Vietnam Pro",sans-serif'; c.fillText(u.vrHint,56,H-34);
  vrTex.needsUpdate=true;
}
function placeVRPanel(i){
  const st=stations[i]; const p=new THREE.Vector3(-1.2,1.4,1.1); st.g.add(vrPanel); vrPanel.position.copy(p);
  vrPanel.rotation.set(0,Math.atan2(0-p.x,1.8-p.z),0); vrPanel.visible=true;
}

/* ------------------------------------------------------------------ tour logic */
let cur=-1, prog=0, playing=false, tween=null, seen=new Set();
const DUR=8;
function tweenCam(pos,tgt,d=1.8,done){tween={p0:camera.position.clone(),t0:controls.target.clone(),p1:pos,t1:tgt,s:0,d,done};}
function goTo(i){
  cur=i; playing=false; prog=0; STATE.count=0;
  markers.forEach(m=>m.visible=i<0);
  if(i<0){ if(!renderer.xr.isPresenting) tweenCam(OV_POS.clone(),OV_TGT.clone(),2); renderAll(); return; }
  seen.add(i); stations[i].s.update(0,clock.elapsedTime,0);
  renderAll();
  if(renderer.xr.isPresenting){ placeRig(i); setTimeout(()=>{if(cur===i)playing=true;},600); }
  else { const v=viewFor(i); tweenCam(v.pos,v.tgt,1.8,()=>{ if(cur===i) playing=true; }); }
}
function replay(){ if(cur<0) return; prog=0; stations[cur].s.update(0,clock.elapsedTime,0); playing=true; }
function placeRig(i){
  const v=viewFor(i,true); const d=v.tgt.clone().sub(v.pos);
  rig.position.set(v.pos.x,0,v.pos.z); rig.rotation.set(0,Math.atan2(-d.x,-d.z),0);
  placeVRPanel(i); drawVR();
}

/* ------------------------------------------------------------------ DOM UI */
const card=$('#card'), rail=$('#rail');
function renderAll(){
  const u=UI[lang];
  document.documentElement.lang=lang;
  $('#lang-vi').setAttribute('aria-pressed',lang==='vi'); $('#lang-en').setAttribute('aria-pressed',lang==='en');
  $('#b-kicker').textContent=u.kicker; $('#b-title').textContent=u.brand; $('#overview').textContent=u.overview;
  $('#vr').textContent=renderer.xr.isPresenting?u.vrExit:u.vr;
  rail.innerHTML=STEPS.map((s,i)=>`<button data-i="${i}" class="${i===cur?'on':''} ${seen.has(i)?'seen':''}"><span class="n">${i+1}</span>${s[lang].name}</button>`).join('');
  const collapsed=card.classList.contains('collapsed');
  const minBtn=`<button class="min" id="min">${collapsed?u.expand:u.collapse}</button>`;
  if(cur<0){
    card.innerHTML=`<div class="kicker"><span>${u.kicker} · ${u.intro7}</span>${minBtn}</div><h1>${u.introTitle}</h1><p class="body">${u.introBody}</p><p class="hint">${u.introHint}</p><div class="row"><button class="btn primary" id="start">${u.start} →</button></div>`;
  } else {
    const s=STEPS[cur][lang], gk=STEPS[cur].gauge;
    card.innerHTML=`<div class="kicker"><span>${u.step} ${cur+1} / ${N} · ${s.name}</span>${minBtn}</div>
      <h1>${s.title}</h1><p class="body">${s.body}</p>
      <ul class="steps">${s.steps.map(t=>`<li>${t}</li>`).join('')}</ul>
      ${gk?`<div class="gauge"><span>${u[gk]}</span><b id="gauge">0 / 16</b></div>`:''}
      <div class="fact"><span>${s.fact[0]}</span><span>${s.fact[1]}</span></div>
      <div class="bar"><i id="bar"></i></div>
      <div class="row"><button class="btn" id="prev" ${cur===0?'disabled':''}>← ${u.prev}</button><button class="btn" id="again">↻ ${u.replay}</button><button class="btn primary" id="next">${cur===N-1?u.toOverview:u.next+' →'}</button></div>`;
  }
  lastLive=-1; live();
  if(renderer.xr.isPresenting) drawVR();
}
let lastLive=-1;
function live(){
  if(cur<0) return;
  const k=Math.round(prog*200); if(k===lastLive) return; lastLive=k;
  const bar=$('#bar'); if(bar) bar.style.width=(prog*100)+'%';
  card.querySelectorAll('.steps li').forEach((li,j)=>{li.classList.toggle('done',prog>=(j+1)/3-1e-6&&prog>0);li.classList.toggle('act',prog>j/3&&prog<(j+1)/3);});
  const gg=$('#gauge'); if(gg) gg.textContent=`${STATE.count} / 16`;
}
card.addEventListener('click',e=>{
  const id=e.target.closest('button')?.id;
  if(id==='start') goTo(0);
  else if(id==='prev'&&cur>0) goTo(cur-1);
  else if(id==='next') goTo(cur===N-1?-1:cur+1);
  else if(id==='again') replay();
  else if(id==='min'){card.classList.toggle('collapsed'); renderAll();}
});
rail.addEventListener('click',e=>{const b=e.target.closest('button'); if(b) goTo(+b.dataset.i);});
$('#overview').onclick=()=>goTo(-1);
const setLang=l=>{lang=l;try{localStorage.setItem('nc-lang',l);}catch(e){} renderAll();};
$('#lang-vi').onclick=()=>setLang('vi'); $('#lang-en').onclick=()=>setLang('en');
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') goTo(cur>=N-1?-1:cur+1);
  else if(e.key==='ArrowLeft') goTo(Math.max(-1,cur-1));
  else if(e.key==='r'||e.key==='R') replay();
});
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,5000);}

const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(); let down=null;
canvas.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
canvas.addEventListener('pointerup',e=>{
  if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6||cur>=0) return;
  const r=canvas.getBoundingClientRect(); ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(ndc,camera); const h=ray.intersectObjects(markers); if(h.length) goTo(h[0].object.userData.i);
});

/* ------------------------------------------------------------------ WebXR */
const vrBtn=$('#vr'); let xrOK=false, savedCam=null;
(async()=>{ try{ xrOK=!!(navigator.xr&&await navigator.xr.isSessionSupported('immersive-vr')); }catch(e){ xrOK=false; } vrBtn.classList.toggle('primary',xrOK); })();
vrBtn.onclick=async()=>{
  if(renderer.xr.isPresenting){ renderer.xr.getSession().end(); return; }
  if(!xrOK){ toast(UI[lang].vrNo); return; }
  try{
    const session=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor']});
    renderer.xr.setReferenceSpaceType('local-floor');
    savedCam={p:camera.position.clone(),t:controls.target.clone()};
    await renderer.xr.setSession(session);
    controls.enabled=false; tween=null;
    session.addEventListener('end',()=>{
      rig.position.set(0,0,0); rig.rotation.set(0,0,0); vrPanel.visible=false; controls.enabled=true;
      if(savedCam){camera.position.copy(savedCam.p); controls.target.copy(savedCam.t);} renderAll(); goTo(cur);
    });
    if(cur<0) goTo(0); else { placeRig(cur); replay(); }
    renderAll();
  }catch(e){ toast(UI[lang].vrFail); }
};
for(let k=0;k<2;k++){
  const c=renderer.xr.getController(k);
  c.addEventListener('selectstart',()=>goTo(cur>=N-1?0:cur+1));
  c.addEventListener('squeezestart',()=>goTo(Math.max(0,cur-1)));
  const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3(0,0,-1)]),new THREE.LineBasicMaterial({color:0xa9cc84}));
  line.scale.z=2.5; c.add(line); rig.add(c);
}

/* ------------------------------------------------------------------ loop */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w/h<.9?72:55;camera.updateProjectionMatrix();}
addEventListener('resize',resize); resize();
const clock=new THREE.Clock(); let vrTick=0, first=true;
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  if(tween){ tween.s+=dt/tween.d; const f=ease(clamp(tween.s));
    camera.position.lerpVectors(tween.p0,tween.p1,f); controls.target.lerpVectors(tween.t0,tween.t1,f);
    if(tween.s>=1){const d=tween.done; tween=null; d&&d();} }
  if(cur>=0){
    if(playing){ prog=Math.min(1,prog+dt/DUR); if(prog>=1) playing=false; }
    stations[cur].s.update(prog,t,dt); live();
    if(renderer.xr.isPresenting && (vrTick+=dt)>.25){vrTick=0; drawVR();}
  }
  if(controls.enabled){ if(controls.target.length()>16) controls.target.setLength(16); controls.update(); }
  renderer.render(scene,camera);
  if(first){first=false; $('#loading').hidden=true;}
});
renderAll();
document.fonts&&document.fonts.ready.then(()=>{ markers.forEach((m,i)=>{m.material.map=markerTex(String(i+1));}); });
</script>

</body></html>
